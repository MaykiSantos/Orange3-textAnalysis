[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orange3-text-analysis"
version = "0.0.3"
description = "Add-on do Orange: limpeza, tradução e classificação de textos com modelos do Hugging Face"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Mayki dos Santos Oliveira", email = "maykioliveira97@gmail.com"},
]
keywords = ["orange3 add-on"]
dependencies = [
    "transformers",
    "torch",
    "sentence-transformers[image]",
    "bertopic",
    "sentencepiece",
    "protobuf",
    "ftfy",
    "emoji",
    "nltk",
    "orange3>=3.40.0",
    "pyqt5>=5.15.11",
    "pyqtwebengine>=5.15.6",
]

[project.urls]
Homepage = "https://github.com/MaykiSantos/Orange3-textAnalysis"
Repository = "https://github.com/MaykiSantos/Orange3-textAnalysis"

[project.entry-points."orange3.addon"]
text_analysis = "text_analysis"

[project.entry-points."orange.widgets"]
"Text Analysis" = "text_analysis.widgets"

[tool.setuptools.packages.find]
include = ["text_analysis*"]

[tool.setuptools.package-data]
"text_analysis.widgets" = ["icons/*.svg"]
"text_analysis" = ["stopwords/*.txt"]
